<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<body>

<h2>Plagiarism Check Completed</h2>
<h2>Here are the Details</h2>

<p>Paper ID:
    <span th:text="${paperId}"></span>
</p>

<p>Author Email:
    <span th:text="${authorEmail}"></span>
</p>

<p>Similarity:
    <span th:text="${similarityPercentage}"></span>%
</p>

<p>Result:
    <span th:text="${result}"></span>
</p>

<p th:text="${summary}"></p>

<p>
    This Check was completed at
    <span th:text="${completedAt}"></span>
</p>

</body>
</html>
